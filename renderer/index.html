<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:* http://localhost:*" />
  <title>DSH Desktop</title>
  <style>
    :root {
      --bg: #eceff3;
      --panel: #fafbfc;
      --panel2: #f2f4f7;
      --border: #dfe4ea;
      --text: #20262e;
      --text2: #5a6472;
      --accent: #3b5bdb;
      --accent2: #5c7cfa;
      --ok: #2f9e44;
      --warn: #e8a00c;
      --err: #e03131;
      --radius: 4px;
    }
    body[data-theme="dark"] {
      --bg: #12151a;
      --panel: #1a1e26;
      --panel2: #21262f;
      --border: #2c333f;
      --text: #e8ecf1;
      --text2: #93a0b2;
      --accent: #4d6bfe;
      --accent2: #6f8dff;
      --ok: #3fb950;
      --warn: #d29922;
      --err: #f85149;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Sans SC", "Microsoft YaHei", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      user-select: none;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* 自绘标题栏 */
    #titlebar {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    #titlebar .logo {
      width: 24px; height: 24px; margin-right: 10px;
      object-fit: contain;
    }
    #titlebar .title { font-size: 13px; font-weight: 600; letter-spacing: .3px; }
    #titlebar .sub { font-size: 11px; color: var(--text2); margin-left: 8px; }
    #titlebar .winbtns { margin-left: auto; -webkit-app-region: no-drag; display: flex; }
    #titlebar .winbtns button {
      width: 40px; height: 44px; border: none; background: transparent;
      color: var(--text2); font-size: 13px; cursor: pointer;
    }
    #titlebar .winbtns button:hover { background: var(--panel2); color: var(--text); }
    #titlebar .winbtns button.close:hover { background: var(--err); color: #fff; }

    /* 状态条 */
    #statusbar {
      display: flex; align-items: center; gap: 16px;
      padding: 8px 18px; background: var(--panel);
      border-bottom: 1px solid var(--border); font-size: 12px; flex-shrink: 0;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot.stopped { background: #57606a; }
    .dot.starting { background: var(--warn); animation: pulse 1s infinite; }
    .dot.running { background: var(--ok); }
    .dot.crashed { background: var(--err); }
    @keyframes pulse { 50% { opacity: .3; } }
    #backendState { font-weight: 600; }
    #engineInfo { color: var(--text2); }
    .spacer { flex: 1; }
    #openUiBtn {
      background: var(--accent); border: none; color: #fff;
      padding: 5px 14px; border-radius: var(--radius); font-size: 12px; cursor: pointer;
    }
    #openUiBtn:hover { background: var(--accent2); }
    #openUiBtn:disabled { background: #2a3a6e; cursor: not-allowed; }

    /* 导航+内容 */
    #body { display: flex; flex: 1; overflow: hidden; }
    #nav {
      width: 180px; background: var(--panel); border-right: 1px solid var(--border);
      padding: 10px 0; flex-shrink: 0; overflow-y: auto;
    }
    #nav .nav-item {
      padding: 9px 18px; font-size: 12.5px; color: var(--text2); cursor: pointer;
      border-left: 3px solid transparent;
    }
    #nav .nav-item:hover { background: var(--panel2); color: var(--text); }
    #nav .nav-item.active {
      color: var(--text); border-left-color: var(--accent);
      background: linear-gradient(90deg, rgba(77,107,254,.12), transparent);
    }
    #content { flex: 1; overflow-y: auto; padding: 22px 26px; }
    #content h2 { font-size: 16px; margin-bottom: 4px; }
    #content .hint { font-size: 12px; color: var(--text2); margin-bottom: 18px; }

    .card {
      background: var(--panel2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; box-shadow: 0 1px 2px rgba(16,24,40,.04); margin-bottom: 14px;
    }
    .card h3 { font-size: 13px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .card h3 .tag { font-size: 10px; padding: 2px 7px; border-radius: 2px; background: rgba(59,91,219,.10); color: var(--accent2); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .mount-item {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 11px 13px; cursor: pointer;
    }
    .mount-item:hover { border-color: var(--accent); }
    .mount-item .name { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
    .mount-item .path { font-size: 10.5px; color: var(--text2); margin-top: 4px; word-break: break-all; }
    .mount-item .state { font-size: 10px; margin-left: auto; padding: 1px 7px; border-radius: 2px; }
    .mount-item .state.ok { background: rgba(63,185,80,.15); color: var(--ok); }
    .mount-item .state.miss { background: rgba(248,81,73,.15); color: var(--err); }

    .row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .row label { font-size: 12px; color: var(--text2); width: 88px; flex-shrink: 0; }
    .row input[type=text], .row input[type=number] {
      flex: 1; min-width: 200px; background: var(--panel); border: 1px solid var(--border);
      color: var(--text); padding: 8px 12px; border-radius: var(--radius); font-size: 12.5px;
    }
    .row input:focus { outline: none; border-color: var(--accent); }
    .row select {
      background: var(--panel); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; border-radius: var(--radius); font-size: 12.5px;
    }
    .btn {
      background: var(--accent); color: #fff; border: none; padding: 8px 18px;
      border-radius: var(--radius); font-size: 12.5px; cursor: pointer;
    }
    .btn:hover { background: var(--accent2); }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn.ghost:hover { border-color: var(--accent); color: var(--accent2); }
    .btn.danger { background: rgba(248,81,73,.15); color: var(--err); border: 1px solid rgba(248,81,73,.4); }
    .btn.sm { padding: 5px 12px; font-size: 11.5px; }

    .tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tbl th { text-align: left; color: var(--text2); font-weight: 500; padding: 7px 10px; border-bottom: 1px solid var(--border); }
    .tbl td { padding: 7px 10px; border-bottom: 1px solid rgba(38,45,58,.6); word-break: break-all; }
    .tbl tr:hover td { background: rgba(77,107,254,.05); }

    #splash { position: fixed; inset: 0; z-index: 99; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      transition: opacity .4s; }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .biglogo {
      width: 88px; height: 88px; object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(59,91,219,.22));
    }
    #splash .sname { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
    #splash .sbar { width: 240px; height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; }
    #splash .sbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    #splash .stext { font-size: 11px; color: var(--text2); }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text2); }
    ::-webkit-scrollbar-corner { background: transparent; }

    #toast {
      position: fixed; top: 56px; right: 20px; z-index: 200;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast-item {
      background: var(--panel); border: 1px solid var(--border);
      border-left: 3px solid var(--ok);
      border-radius: var(--radius); padding: 11px 16px; font-size: 12.5px;
      box-shadow: 0 1px 3px rgba(16,24,40,.06);
      opacity: 0; transform: translateX(20px); transition: all .25s;
      max-width: 340px;
    }
    .toast-item.show { opacity: 1; transform: translateX(0); }
    .toast-item.err { border-left-color: var(--err); }
    .toast-item .t-title { font-weight: 600; margin-bottom: 2px; }
    .toast-item .t-sub { color: var(--text2); font-size: 11.5px; word-break: break-all; }
  </style>
</head>
<body>
  <div id="splash">
    <img class="biglogo" src="assets/dsh-icon-256.png" alt="DSH" />
    <div class="sname">DEEPSEEK HARNESS</div>
    <div class="sbar"><i id="sbarFill"></i></div>
    <div class="stext" id="splashText">正在启动后端引擎...</div>
  </div>

  <div id="app">
    <div id="titlebar">
      <img class="logo" src="assets/dsh-icon-32.png" alt="DSH" />
      <div class="title">DSH Desktop</div>
      <div class="sub" id="verLabel"></div>
      <div class="winbtns">
        <button onclick="dsh.win.minimize()">─</button>
        <button id="btnMax" onclick="dsh.win.maximize()">□</button>
        <button class="close" onclick="dsh.win.close()">✕</button>
      </div>
    </div>

    <div id="statusbar">
      <div><span class="dot stopped" id="stateDot"></span><span id="backendState">后端已停止</span></div>
      <div id="engineInfo"></div>
      <div class="spacer"></div>
      <button id="openUiBtn" disabled onclick="openWebUi()">打开 Harness 主窗口</button>
    </div>

    <div id="body">
      <div id="nav">
        <div class="nav-item active" data-panel="overview">概览</div>
        <div class="nav-item" data-panel="models">模型中心</div>
        <div class="nav-item" data-panel="engines">引擎管理</div>
        <div class="nav-item" data-panel="mounts">资源挂接</div>
        <div class="nav-item" data-panel="memory">记忆中枢</div>
        <div class="nav-item" data-panel="system">系统设置</div>
      </div>
      <div id="content"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <div id="toast"></div>
</body>
</html>
